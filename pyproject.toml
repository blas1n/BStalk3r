[project]
name = "bstalk3r"
version = "0.1.0"
description = "Low Float Momentum Runner research system on Alpaca Paper Trading (rule-based, no LLM in the realtime loop)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
bstalk3r = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.coverage.run]
source = ["src"]
# Thin SDK glue / interactive loop: exercised via the live `check` / `run`
# commands and the e2e checklist, not unit-mocked here.
omit = ["src/main.py", "src/alpaca_client.py", "src/market_data.py"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "raise NotImplementedError", "\\.\\.\\."]
